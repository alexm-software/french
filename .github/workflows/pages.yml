name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Pillow for placeholder art
        run: pip install pillow
      - run: npm ci
      - run: npm run build
      - name: Publish Le Village at the site root and the previous site at old/
        run: |
          rm -rf publish
          mkdir -p publish/old
          cp -a village/. publish/
          cp -a dist/. publish/old/
          test -f publish/.nojekyll
          test -f publish/index.html
          test -f publish/assets/app.js
          test -f publish/assets/map/village.jpg
          test -f publish/old/index.html
          test -f publish/old/data/index.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
