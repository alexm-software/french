name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# village/ is published as committed. There is no build step here, so a local
# preview (python -m http.server in village/) and Pages serve the same files.
# index.js, live.js, map.js, and talk/ stay in git. checks.yml rebuilds them and
# fails the pull request if the committed copies have gone stale.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the static site
        run: |
          test -f village/.nojekyll
          test -f village/index.html
          test -f village/app.js
          test -f village/map/world.jpg
          test -f village/v2/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: village

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
